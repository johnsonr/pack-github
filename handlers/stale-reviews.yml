# One digest a day, not N pings.
#
# Cron rather than signal on purpose: "this has been sitting for three days" is not an event
# anything emits. It is a question you have to go and ask, which is what a schedule is for.
- id: gh-stale-reviews
  name: Daily digest of reviews waiting on me
  description: Once each morning, the review requests that have gone quiet — grouped, not one ping each
  schedule: "0 0 8 * * *"
  autonomous: false
  spec:
    kind: typescript
    module: stale-reviews.handler.ts
