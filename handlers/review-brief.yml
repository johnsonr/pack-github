# When a review is requested on a PR, say what the graph already knows about it.
#
# The value is not the notification — GitHub sends one of those. It is the CONTEXT: whether this
# author is new to you, what else is open on the repo, how big the thing is. That join is what a
# world can do and a GitHub notification cannot.
- id: gh-review-brief
  name: Brief me when a review is requested
  description: A review request arrives with what this world knows about the author and the repo
  match:
    signalType: GitHubReviewRequested
  autonomous: false
  spec:
    kind: typescript
    module: review-brief.handler.ts
